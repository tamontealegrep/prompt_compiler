changelog:
  - date: "2026-08-06"
    description: "Repo owner set the project's retry-counter naming convention to the short _try suffix (token economy) instead of _retry_count, and asked to update the compiler's own heuristic to match. Updated app/validators.py::_validate_question_self_loops (B10) to recognize _try or _counter instead of the hardcoded _retry_count, via TDD (4 tests updated/added in tests/unit/app/test_validators.py, confirmed RED then GREEN). Verified against the real reference agent: its _try-suffixed counters no longer trigger a false QUESTION_SELF_LOOP_WITHOUT_RETRY_COUNTER warning, still 0 validation errors. B10's underlying heuristic-vs-real-check gap remains open; B11 (the check never fires for the recommended question-decision-question pattern) is untouched. Full suite: 212 tests, 206 passing + 6 strict-xfail."
  - date: "2026-08-06"
    description: "Repo owner corrected B1: the duplicated [[ input_variables_block ]] render is intentional, not a bug — reclassified in SPEC.md/STATUS.yaml, roadmap phase 19 cancelled, templates left untouched. Implemented B2 (SPEC.md §5.1) via TDD: added/updated 13 tests in tests/unit/app/test_schemas.py (confirmed RED against pre-fix code), then completed FlowObjectBase.validate_semantics()'s per-type invariant matrix in app/schemas.py — execute/final/say now restricted to the node types templates/system_prompt.md.j2's TYPE_SEMANTICS documents them for, and decision now requires an explicit wait: \"no\". Verified non-breaking against all real content under agents/ (raw-YAML scan pre-fix, full compile_agent() run post-fix, zero violations either way). Full suite: 210 tests, 204 passing + 6 strict-xfail (B3, B4 x2, B5 x2)."
  - date: "2026-08-06"
    description: "Translated PATTERN_GUIDE.md to English and rewrote it as a domain-agnostic authoring guide (no references to any specific agent_id). Incorporated patterns observed while reading a real production-style agent in agents/defs/ (read-only, not committed to this repo): conditional-skip decisions, multi-branch decision routing, a farewell-message-plus-silent-terminal closing pattern, flow_rules-backed anti-hallucination guardrails for tool-fetching action nodes, and a handler-level repeat/no-input retry pattern. Found and logged B11 in SPEC.md §5.1 in the process: the self-loop retry-counter validator never fires for the guide's own recommended question-decision-question pattern. Updated CLAUDE.md's language-exception note to reflect PATTERN_GUIDE.md now being English."
  - date: "2026-08-06"
    description: "Audited app/schemas.py, utils.py, loaders.py, validators.py, classifier.py, deduplicator.py, renderers.py, compiler.py, and both Jinja templates for DSL/state-machine bugs and gaps. Logged 10 findings (B1-B10) in SPEC.md §5.1, most notably B1: both templates render [[ input_variables_block ]] twice. Built tests/ from scratch (conftest.py, tests/fixtures/minimal_agent/, 7 unit test modules, 2 integration test modules) — 198 tests, 190 passing + 8 strict-xfail documenting the known bugs. No source code changed; ruff check tests/ clean."
  - date: "2026-08-06"
    description: "Adapted framework_example/'s 7 generic template documents into project-specific root-level files (CLAUDE.md, SPEC.md, EXPERTS.md, FRAMEWORK.md, TESTING.md, DESIGN_PATTERNS.md, STATUS.yaml) for Prompt Compiler, based on a full read of app/, templates/, existing docs, pyproject.toml, and git history. No source code changed."
