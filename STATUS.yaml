  important_context: |
    This session had three phases so far:
    1. Adapted the generic framework_example/ (7 template docs) into
       project-specific root-level files (2026-08-06, see changelog below).
    2. Audited every app/ module in the DSL/state-machine pipeline plus both
       Jinja templates, logged findings B1-B10 in SPEC.md §5.1, and built the
       tests/ suite the project was missing.
    3. The repo owner corrected B1 (the duplicated
       [[ input_variables_block ]] render is INTENTIONAL, not a bug — do not
       "fix" it; roadmap phase 19 is cancelled) and asked to implement B2.
       B2 is now fixed: FlowObjectBase.validate_semantics() in app/schemas.py
       has a complete per-type invariant matrix (see SPEC.md §13's 2026-08-06
       decision log entry for the exact table and the textual basis for each
       constraint). Also found B11 while reading a real agent for the
       PATTERN_GUIDE.md rewrite — logged, not yet scheduled.

    IMPORTANT: B1 is by design. If a future audit or a fresh read of the
    templates flags the duplicated input_variables_block again, check SPEC.md
    §5.1 first — it's already resolved, don't re-report it as a bug.

    B2 is a breaking schema change for any agent YAML that relied on the
    now-forbidden combinations (e.g. a decision node omitting wait, or a
    start/subflow_change/action node with non-empty say). It was verified
    non-breaking against everything currently in this repo's local agents/
    tree (zero violations, both via a raw-YAML scan before the fix and a
    full compile_agent() run after) — but content in other checkouts of the
    separate agents/ repo was not checked and could still break.

    Test suite design notes for whoever continues this:
    - tests/conftest.py has in-memory AgentSpec/StateModel/etc. builders
      (build_minimal_agent_spec, build_message_state, build_terminal_state)
      used by nearly every unit test — prefer these over hand-rolling specs.
    - tests/fixtures/minimal_agent/ is a real on-disk agent satisfying the
      REAL profiles/channels/voice.yaml's required policy sections (name_
      handling_rules, style_and_vui_rules, pronunciation_rules, compliance_
      and_scope_rules, data_and_variable_rules) — if that profile's required
      sections change, this fixture (and tests/integration/test_compile_
      with_subflows.py's inline REQUIRED_VOICE_POLICY_SECTIONS) needs a
      matching update.
    - Known-bug tests use `pytest.mark.xfail(strict=True, ...)` describing
      the INTENDED behavior, never the buggy one — per DESIGN_PATTERNS.md A10
      (retrospective test anti-pattern). When a bug is fixed, its xfail test
      will XPASS and fail the run until the marker is removed.
  do_not_forget:
